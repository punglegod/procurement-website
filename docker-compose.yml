name: procurement

services:
  web:
    image: procurement-website:stage9
    build:
      # 构建上下文只包含代码目录，根目录 .env 和 data 不会送入构建。
      context: ./backend
      additional_contexts:
        frontend: ./frontend
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS frontend_build
        WORKDIR /frontend
        COPY --from=frontend /package.json /package-lock.json ./
        RUN npm ci --no-audit --no-fund
        COPY --from=frontend /index.html /vite.config.js ./
        COPY --from=frontend /src ./src
        COPY --from=frontend /public ./public
        RUN npm run build

        FROM python:3.12-slim-bookworm
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 TZ=Asia/Shanghai
        WORKDIR /app
        COPY requirements.txt /app/backend/requirements.txt
        RUN python -m pip install --no-cache-dir --upgrade "pip>=26.2.0" && python -m pip install --no-cache-dir -r /app/backend/requirements.txt
        COPY __init__.py /app/backend/__init__.py
        COPY app /app/backend/app
        COPY scripts/manage_admin.py /app/backend/scripts/manage_admin.py
        COPY --from=frontend_build /frontend/dist /app/frontend/dist
        RUN mkdir -p /app/data && chown -R 10001:10001 /app/data
        USER 10001:10001
        EXPOSE 8000
        CMD ["python", "-m", "uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-proxy-headers"]
    init: true
    restart: unless-stopped
    # 默认绑定回环地址；站内仍要求账号登录。
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: Asia/Shanghai
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - procurement_data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 90s
    healthcheck:
      # 匿名健康接口也受保护；401 表示 HTTP 服务正常且认证门禁有效。
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error; exec('try:\\n urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\", timeout=5)\\n raise SystemExit(1)\\nexcept urllib.error.HTTPError as e:\\n assert e.code == 401')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  procurement_data:
